name: Deploy Hanoki to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_GOOGLE_SHEET_GUIDE_URL: ${{ vars.VITE_PUBLIC_GOOGLE_SHEET_GUIDE_URL }}
          VITE_PUBLIC_GOOGLE_SHEET_COVER_URL: ${{ vars.VITE_PUBLIC_GOOGLE_SHEET_COVER_URL }}
          VITE_PUBLIC_GOOGLE_SHEET_ROOMS_URL: ${{ vars.VITE_PUBLIC_GOOGLE_SHEET_ROOMS_URL }}
          VITE_PUBLIC_GOOGLE_SHEET_URL: ${{ vars.VITE_PUBLIC_GOOGLE_SHEET_URL }}
          VITE_SITE_URL: https://hanoki.com.vn

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
